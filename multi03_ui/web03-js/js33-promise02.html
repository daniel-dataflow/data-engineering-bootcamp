<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button onclick="promiseTest();">promise</button>

    <table border="1" id="tb"></table>

    <script>
        function createTable(data) {
            const table = document.getElementById("tb");

            // 초기화 시켜줘. 안쓰게 되면 append를 연속적으로 하기 때문에 그것을 방지 하기 위해서.
            table.innerHTML = "";

            // console.log(data.ROWSET);
            // console.log(data["ROWSET"]);
            const rows = data.ROWSET.ROW;

            const keys = Object.keys(rows[0]);
            // console.log(keys);

            const tr = document.createElement("tr");
            // for in : index, value
            // for of : value
            for (const key of keys) {
                const th = document.createElement("th");
                th.appendChild(document.createTextNode(key));
                tr.appendChild(th);
            }
            table.appendChild(tr);

            for (const row of rows) {
                const tr = document.createElement("tr");
                // Object.entries : key, value 짤라서 가져올 수 있다.
                for (const [key, val] of Object.entries(row)) {
                    const td = document.createElement("td");
                    td.appendChild(document.createTextNode(val));
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
                    
        }

        function promiseTest() {
            // promise 사용해서 
            // emplist.json 요청해서 
            // 응답받은 데이터를 createTable에 전달해서 
            // 실제로 테이블 만들기
            
            function myPromise(url) {
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();

                    xhr.onreadystatechange = () => {
                        if (xhr.readyState == 4) {
                            if (xhr.status == 200) {
                                const jsonToObj = JSON.parse(xhr.responseText);
                                resolve(jsonToObj);
                            } else {
                                reject(new Error(xhr.status));
                            }
                        }
                    }
                    // xhr.onload = () => {
                    //     if (xhr.status =200) {
                    //         resolve(JSON.parse(xhr.responseText));
                    //     } else {
                    //         reject(new Error(xhr.status));
                    //     } 
                    // }

                    xhr.open("GET", url);
                    xhr.send();
                });
            }

            myPromise("emplist.json")
            .then((data) => {createTable(data);});
            

        }
    </script>

</body>
</html>
